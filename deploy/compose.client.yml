# Local preview stack: Manager + Client on this machine.
#
# Purpose: try CodeBridge end-to-end locally before deploying the real
# (public, OAuth-protected) Manager on a server.
#
# When you deploy the real server, switch the client to it by setting in
# deploy/.env:
#   CODEBRIDGE_MANAGER_URL=wss://<your-server>/agent
#   CODEBRIDGE_ALLOW_INSECURE_WS=false
#   # fresh enrollment: CODEBRIDGE_ENROLL_CODE=<code from the real server's admin API>
#   # and start with an empty client-state directory (the local credential only
#   # verifies against this local Manager)
# then run: docker compose -f deploy/compose.client.yml up -d client
# (the manager service below can stay local-only or be stopped with `stop manager`).

name: codebridge-local

x-host-info: &host-info
  # Real host identity injected at container start so the device registers as
  # this machine, not as the container.
  CODEBRIDGE_DEVICE_ID: ${CODEBRIDGE_DEVICE_ID:-${HOSTNAME_SLUG:-codebridge-local}}
  CODEBRIDGE_DEVICE_NAME: ${CODEBRIDGE_DEVICE_NAME:-${HOST_USER:-local}@${HOSTNAME_SHORT:-codebridge}}

services:
  manager:
    build:
      context: ..
      dockerfile: Dockerfile.manager
    image: codebridge-manager:local
    container_name: codebridge-local-manager
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      CODEBRIDGE_ADDR: ":8080"
      CODEBRIDGE_STATE_FILE: /data/auth.json
      CODEBRIDGE_AUDIT_LOG: /data/audit.jsonl
      CODEBRIDGE_ADMIN_TOKEN: ${CODEBRIDGE_ADMIN_TOKEN}
      # Local dev bearer token for MCP (doctor / smoke testing). The real
      # deployment uses OAuth instead of CODEBRIDGE_MCP_TOKEN.
      CODEBRIDGE_MCP_TOKEN: ${CODEBRIDGE_MCP_TOKEN:-local-dev-mcp-token}
      # MCP call history (filterable/paged in /admin/ui), persisted on the
      # data volume; JSONL audit log remains the append-only source of truth.
      CODEBRIDGE_MCP_DB: /data/mcp-calls.db
    volumes:
      - codebridge-data:/data
    ports:
      - "127.0.0.1:${CODEBRIDGE_MANAGER_PORT:-8180}:8080"
      - "127.0.0.1:${CODEBRIDGE_GRPC_PORT:-8181}:8081"

  client:
    build:
      context: ..
      dockerfile: Dockerfile.client
    image: codebridge-client:local
    container_name: codebridge-local-client
    restart: unless-stopped
    depends_on:
      - manager
    environment:
      TZ: Asia/Shanghai
      <<: *host-info
      # Agent transport: gRPC bidi stream (host[:port], default port 8081).
      CODEBRIDGE_MANAGER_HOST: ${CODEBRIDGE_MANAGER_HOST:-manager:8081}
      # plaintext ws inside the compose network only; never enable against a
      # public manager
      CODEBRIDGE_ALLOW_INSECURE_WS: ${CODEBRIDGE_ALLOW_INSECURE_WS:-true}
      # Workspaces live in the persistent client.json (first boot seeds the
      # directories from /Users/tangxingpeng/IdeaProjects below) so the
      # configuration UI can edit them with hot reload.
      CODEBRIDGE_WORKSPACES: ${CODEBRIDGE_WORKSPACES:-}
      CODEBRIDGE_CONFIG: /state/client.json
      CODEBRIDGE_CREDENTIAL_FILE: /state/credentials.json
      CODEBRIDGE_STATE_DIR: /state
      CODEBRIDGE_ENROLL_CODE: ${CODEBRIDGE_ENROLL_CODE:-}
      # Write mode stays off unless you set e.g. CODEBRIDGE_WRITABLE_WORKSPACES=codebridge
      # AND mount the workspace read-write.
      CODEBRIDGE_WRITABLE_WORKSPACES: ${CODEBRIDGE_WRITABLE_WORKSPACES:-}
      CODEBRIDGE_ENABLE_LSP: ${CODEBRIDGE_ENABLE_LSP:-false}
      # UI must bind 0.0.0.0 inside the container for the host port mapping to
      # reach it; the published port stays loopback-only on the host.
      CODEBRIDGE_UI_ADDR: ${CODEBRIDGE_UI_ADDR:-0.0.0.0:8190}
    ports:
      - "127.0.0.1:${CODEBRIDGE_UI_PORT:-8190}:8190"
    volumes:
      - ./client-state:/state
      # Whole home tree, read-only: the "host" workspace in full-access mode
      # is the real host home directory (~). Scan tools skip bulky system
      # trees (see shouldSkipDir) and sensitive paths stay policy-blocked.
      - ${HOST_HOME_DIR:-/Users/tangxingpeng}:/host:ro
      - ${HOST_PROJECTS_DIR:-/Users/tangxingpeng/IdeaProjects}:/workspaces:ro
      # opencode ships inside the image. Subagents run with an isolated
      # config (no user plugins/extensions): only the provider auth file is
      # mounted, so runs are deterministic and cannot hang on host-only
      # plugin infrastructure. Models/agents are chosen per call via the
      # agent tool's model/agent parameters.
      - ${HOST_OPENCODE_AUTH:-/Users/tangxingpeng/.local/share/opencode/auth.json}:/home/codebridge/.local/share/opencode/auth.json:ro

volumes:
  codebridge-data:
