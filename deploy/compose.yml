services:
  manager:
    build:
      context: ..
      dockerfile: Dockerfile.manager
    restart: unless-stopped
    environment:
      CODEBRIDGE_ADDR: ":8080"
      CODEBRIDGE_STATE_FILE: "/data/auth.json"
      CODEBRIDGE_ADMIN_TOKEN: "${CODEBRIDGE_ADMIN_TOKEN}"
      CODEBRIDGE_PUBLIC_URL: "${CODEBRIDGE_PUBLIC_URL:-}"
      CODEBRIDGE_OAUTH_ISSUER: "${CODEBRIDGE_OAUTH_ISSUER:-}"
      CODEBRIDGE_OAUTH_JWKS_URL: "${CODEBRIDGE_OAUTH_JWKS_URL:-}"
      CODEBRIDGE_OAUTH_RESOURCE: "${CODEBRIDGE_OAUTH_RESOURCE:-}"
      CODEBRIDGE_OAUTH_SCOPE: "${CODEBRIDGE_OAUTH_SCOPE:-codebridge.read}"
      CODEBRIDGE_MCP_TOKEN: "${CODEBRIDGE_MCP_TOKEN:-}"
    volumes:
      - codebridge-data:/data
    ports:
      - "8080:8080"

volumes:
  codebridge-data:
