<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeBridge Manager</title>
<style>
  :root {
    --bg: #08090a;
    --panel: #0f1011;
    --raised: #191a1b;
    --hover-surface: rgba(255,255,255,.045);
    --text: #f7f8f8;
    --text-2: #d0d6e0;
    --text-3: #8a8f98;
    --text-4: #62666d;
    --line: rgba(255,255,255,.06);
    --line-2: rgba(255,255,255,.09);
    --indigo: #5e6ad2;
    --indigo-hi: #7170ff;
    --indigo-soft: rgba(94,106,210,.14);
    --green: #10b981;
    --green-soft: rgba(16,185,129,.12);
    --amber: #e0a458;
    --amber-soft: rgba(224,164,88,.12);
    --red: #e5606a;
    --red-soft: rgba(229,96,106,.1);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 12px;
    --ease: cubic-bezier(.25,.46,.45,.94);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,106,210,.35); }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 0 24px; height: 52px;
    background: rgba(8,9,10,.82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand b { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .brand .sub { font-size: 11.5px; color: var(--text-4); margin-left: 2px; }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); background: var(--hover-surface); border: 1px solid var(--line); border-radius: 9999px; padding: 2px 10px; }

  .page { max-width: 1080px; margin: 0 auto; padding: 20px 24px 80px; display: flex; flex-direction: column; gap: 16px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .card-h b { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .card-h .hint { margin-left: auto; font-size: 11px; color: var(--text-4); }
  .card-b { padding: 14px 16px 16px; }

  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th { text-align: left; font-weight: 500; font-size: 11px; color: var(--text-4); letter-spacing: .04em; padding: 4px 8px 8px 0; border-bottom: 1px solid var(--line-2); }
  table.grid td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 12.5px; color: var(--text-2); }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s var(--ease); }
  tbody tr:hover { background: rgba(255,255,255,.025); }
  .mono { font-family: var(--mono); font-size: 11.5px; }
  .on { color: var(--green); }
  .off { color: var(--text-4); }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; border-radius: 4px; padding: 1px 8px; border: 1px solid var(--line-2); color: var(--text-3); }
  .badge.on { color: var(--green); border-color: rgba(16,185,129,.25); background: var(--green-soft); }
  .badge .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  button { font-family: var(--sans); font-size: 12.5px; font-weight: 500; cursor: pointer; border-radius: var(--r-sm); padding: 7px 15px; transition: all .15s var(--ease); }
  button.primary {
    background: linear-gradient(180deg, #6a75d8 0%, var(--indigo) 100%);
    color: #fff; border: 1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 4px rgba(0,0,0,.5), 0 0 0 1px rgba(94,106,210,.35);
    padding: 8px 22px; font-weight: 600;
  }
  button.primary:hover { background: linear-gradient(180deg, #7d88e2 0%, #6670d6 100%); }
  button.primary:active { transform: translateY(1px); }
  button.ghost { background: rgba(255,255,255,.03); color: var(--text-2); border: 1px solid var(--line-2); }
  button.ghost:hover { background: var(--hover-surface); color: var(--text); border-color: rgba(255,255,255,.16); }
  button.ghost:active { transform: translateY(1px); }
  button.danger { background: none; color: var(--red); border: 1px solid rgba(229,96,106,.3); }
  button.danger:hover { background: var(--red-soft); border-color: rgba(229,96,106,.5); }

  input[type=text], input[type=password] {
    width: 100%; background: rgba(255,255,255,.02); color: var(--text);
    border: 1px solid var(--line-2); border-radius: var(--r-sm);
    padding: 7px 11px; font-family: var(--mono); font-size: 12.5px;
    transition: border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  }
  input::placeholder { color: var(--text-4); }
  input:hover { border-color: rgba(255,255,255,.16); }
  input:focus { outline: none; border-color: var(--indigo); background: rgba(94,106,210,.05); box-shadow: 0 0 0 3px rgba(94,106,210,.18); }

  .grid2 { display: grid; grid-template-columns: minmax(220px, 340px) minmax(160px, 220px); gap: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 5px; }
  .msg { font-size: 12px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }

  .credbox { background: rgba(224,164,88,.06); border: 1px solid rgba(224,164,88,.3); border-radius: var(--r-md); padding: 10px 14px; margin: 12px 0 0; font-size: 12.5px; word-break: break-all; color: var(--amber); font-family: var(--mono); }

  #audit { margin: 0; max-height: 380px; overflow: auto; background: #0a0b0c; font-family: var(--mono); font-size: 11.5px; }
  #audit .arow { display: grid; grid-template-columns: 128px 148px 52px 1fr 56px; gap: 10px; padding: 5px 16px; border-bottom: 1px solid rgba(255,255,255,.03); line-height: 1.5; }
  #audit .arow:hover { background: rgba(255,255,255,.025); }
  #audit .at { color: var(--text-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #audit .aev { white-space: nowrap; }
  #audit .aev .b { border-radius: 3px; padding: 0 6px; font-size: 10.5px; }
  #audit .aok { color: var(--green); }
  #audit .afail { color: var(--amber); }
  #audit .ameta { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #audit .ahead { color: var(--text-4); font-size: 10px; letter-spacing: .05em; border-bottom: 1px solid var(--line); background: #0a0b0c; padding: 6px 0; }
  #audit::-webkit-scrollbar { width: 8px; }
  #audit::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px; }
  .ev-admin { background: var(--indigo-soft); color: var(--indigo-hi); }
  .ev-device { background: rgba(255,255,255,.06); color: var(--text-2); }
  .ev-mcp { background: var(--green-soft); color: var(--green); }
  .ev-other { background: rgba(255,255,255,.04); color: var(--text-3); }

  #gate { max-width: 400px; margin: 14vh auto; padding: 30px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
  #gate h1 { font-size: 15px; font-weight: 600; margin: 0 0 6px; display: flex; align-items: center; gap: 9px; }
  #gate p { color: var(--text-4); font-size: 12.5px; margin: 0 0 18px; line-height: 1.6; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--r-lg); font-family: var(--sans); font-size: 13px; padding: 24px; max-width: 460px; box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }

  .empty-hint { color: var(--text-4); font-size: 12px; text-align: center; padding: 18px 0; }

  :focus-visible { outline: 2px solid var(--indigo-hi); outline-offset: 1px; border-radius: 4px; }
  input:focus-visible { outline: none; }
</style>
</head>
<body>

<div id="gate" hidden>
  <h1>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect x="4" y="8.5" width="12" height="8" rx="1.5" stroke="#5e6ad2" stroke-width="1.6"/>
      <path d="M7 8.5 V6 a3 3 0 0 1 6 0 V2.5" stroke="#8a8f98" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    CodeBridge Manager
  </h1>
  <p>输入管理令牌（CODEBRIDGE_ADMIN_TOKEN）。令牌仅存于本页 sessionStorage，不会写入 URL 或 Cookie。</p>
  <input type="password" id="gate-token" placeholder="admin token" autocomplete="off">
  <div style="margin-top:14px; display:flex; gap:10px; align-items:center">
    <button class="primary" id="gate-go">进入</button>
    <span class="msg" id="gate-msg"></span>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M3 14 L3 10 Q3 5 10 5 Q17 5 17 10 L17 14" stroke="#5e6ad2" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M3 14 L7 14 M13 14 L17 14" stroke="#8a8f98" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="10" cy="9" r="1.4" fill="#7170ff"/>
    </svg>
    <b>CodeBridge</b><span class="sub">Manager 维护台</span>
  </div>
  <div class="right">
    <span class="chip" id="clock"></span>
    <button class="ghost" id="logout">锁定</button>
  </div>
</header>

<div class="page">

  <section class="card">
    <div class="card-h"><b>设备</b><span class="hint">5s 刷新</span></div>
    <div class="card-b">
      <table class="grid">
        <thead><tr><th>设备 ID</th><th>名称</th><th>账户</th><th>状态</th><th>工作区</th><th>更新时间</th><th style="width:190px">操作</th></tr></thead>
        <tbody id="devices"></tbody>
      </table>
      <div style="margin-top:10px"><span class="msg" id="dev-msg"></span></div>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><b>注册码</b><span class="hint">一次性 · 有效期可配</span></div>
    <div class="card-b">
      <div class="grid2">
        <div class="field">
          <label for="enr-account">目标账户（account_id）</label>
          <input type="text" id="enr-account" placeholder="default">
        </div>
        <div class="field">
          <label for="enr-ttl">有效期（秒）</label>
          <input type="text" id="enr-ttl" placeholder="600">
        </div>
      </div>
      <div style="margin-top:12px; display:flex; gap:10px; align-items:center">
        <button class="primary" id="enr-create">生成一次性注册码</button>
        <span class="msg" id="enr-msg"></span>
      </div>
      <div id="enr-result" class="credbox" hidden></div>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><b>审计日志</b><span class="hint">最近 200 条 · 失败事件高亮</span></div>
    <div id="audit" aria-label="audit log"><div class="arow ahead"><span>时间</span><span>事件</span><span>结果</span><span>详情</span><span>耗时</span></div></div>
  </section>

</div>
</div>

<dialog id="confirm">
  <p id="confirm-text"></p>
  <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:18px">
    <button class="ghost" id="confirm-no">取消</button>
    <button class="danger" id="confirm-yes">确认执行</button>
  </div>
</dialog>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = sessionStorage.getItem('cb-admin-token') || '';

  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (r.status === 401) { showGate(); throw new Error('unauthorized'); }
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.status); });
      return r.json();
    });
  }

  function showGate() {
    $('app').hidden = true;
    $('gate').hidden = false;
    sessionStorage.removeItem('cb-admin-token');
    token = '';
    $('gate-token').focus();
  }

  $('gate-go').addEventListener('click', function () {
    token = $('gate-token').value.trim();
    if (!token) return;
    api('GET', '/admin/devices').then(function () {
      sessionStorage.setItem('cb-admin-token', token);
      $('gate').hidden = true;
      $('app').hidden = false;
      refresh();
    }).catch(function () {
      $('gate-msg').textContent = '令牌无效';
      $('gate-msg').className = 'msg err';
    });
  });
  $('gate-token').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('gate-go').click(); });
  $('logout').addEventListener('click', showGate);

  function fmtTime(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString('zh-CN', { hour12: false }); } catch (e) { return iso; }
  }

  function confirmDialog(text) {
    return new Promise(function (resolve) {
      $('confirm-text').textContent = text;
      var d = $('confirm');
      d.showModal();
      $('confirm-yes').onclick = function () { d.close(); resolve(true); };
      $('confirm-no').onclick = function () { d.close(); resolve(false); };
    });
  }

  function renderDevices(devices) {
    var body = $('devices');
    body.innerHTML = '';
    (devices || []).forEach(function (d) {
      var tr = document.createElement('tr');
      function td(text, cls) {
        var el = document.createElement('td');
        el.textContent = text == null ? '—' : text;
        if (cls) el.className = cls;
        return el;
      }
      tr.appendChild(td(d.id));
      tr.appendChild(td(d.name));
      tr.appendChild(td(d.account_id || 'default'));
      tr.appendChild(td(d.online ? '在线' : '离线', d.online ? 'on' : 'off'));
      var ws = td(String((d.workspaces || 0)), '');
      tr.appendChild(ws);
      tr.appendChild(td(fmtTime(d.updated_at)));
      var act = document.createElement('td');
      var rotate = document.createElement('button');
      rotate.className = 'ghost'; rotate.textContent = '轮换凭证';
      rotate.addEventListener('click', function () {
        confirmDialog('轮换 ' + d.id + ' 的设备凭证？旧凭证立即失效，新凭证只显示一次。')
          .then(function (ok) {
            if (!ok) return;
            api('POST', '/admin/devices/' + encodeURIComponent(d.id) + '/rotate')
              .then(function (r) {
                $('dev-msg').className = 'msg ok';
                $('dev-msg').textContent = '已轮换 ' + d.id;
                alert('新凭证（只显示一次）：\n' + r.device_credential);
                refresh();
              })
              .catch(function (e) { err('dev-msg', e.message); });
          });
      });
      var revoke = document.createElement('button');
      revoke.className = 'danger'; revoke.textContent = '吊销设备';
      revoke.style.marginLeft = '8px';
      revoke.addEventListener('click', function () {
        confirmDialog('吊销设备 ' + d.id + '？设备将被断开且无法再注册，除非用新注册码重新注册。')
          .then(function (ok) {
            if (!ok) return;
            api('DELETE', '/admin/devices/' + encodeURIComponent(d.id))
              .then(function () { okMsg('dev-msg', '已吊销 ' + d.id); refresh(); })
              .catch(function (e) { err('dev-msg', e.message); });
          });
      });
      act.appendChild(rotate); act.appendChild(revoke);
      tr.appendChild(act);
      body.appendChild(tr);
    });
    if (!devices || !devices.length) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 7; td.className = 'off'; td.textContent = '暂无设备';
      tr.appendChild(td); body.appendChild(tr);
    }
  }

  function mkRow(ev) {
    var row = document.createElement('div');
    row.className = 'arow';
    function span(cls, text) { var s = document.createElement('span'); s.className = cls; s.textContent = text; return s; }
    var t = document.createElement('span'); t.className = 'at'; t.title = ev.time || '';
    t.textContent = ev.time ? ev.time.replace(/^\d{4}-/, '').replace('T', ' ').replace(/\.\d+Z$/, '') : '';
    row.appendChild(t);
    var evWrap = document.createElement('span'); evWrap.className = 'aev';
    var b = document.createElement('span');
    var evName = ev.event || '?';
    b.className = 'b ' + (evName.indexOf('admin.') === 0 ? 'ev-admin' : evName.indexOf('device.') === 0 ? 'ev-device' : evName.indexOf('mcp.') === 0 ? 'ev-mcp' : 'ev-other');
    b.textContent = evName;
    evWrap.appendChild(b);
    row.appendChild(evWrap);
    row.appendChild(span(ev.ok === false || ev.success === false ? 'afail' : 'aok', ev.success === false ? '失败' : '成功'));
    var meta = [];
    if (ev.actor_id) meta.push('actor=' + ev.actor_id);
    if (ev.tool) meta.push('tool=' + ev.tool);
    if (ev.device_id) meta.push('device=' + ev.device_id);
    if (ev.workspace) meta.push('ws=' + ev.workspace);
    if (ev.error_kind) meta.push('err=' + ev.error_kind);
    row.appendChild(span('ameta', meta.join(' · ') || '—'));
    row.appendChild(span('ameta', ev.duration_ms != null ? ev.duration_ms + 'ms' : ''));
    return row;
  }

  function okMsg(id, t) { var e = $(id); e.className = 'msg ok'; e.textContent = t; }
  function err(id, t) { var e = $(id); e.className = 'msg err'; e.textContent = t; }

  $('enr-create').addEventListener('click', function () {
    var body = {};
    var account = $('enr-account').value.trim();
    var ttl = parseInt($('enr-ttl').value.trim(), 10);
    if (account) body.account_id = account;
    if (ttl > 0) body.ttl_seconds = ttl;
    api('POST', '/admin/enrollments', body).then(function (r) {
      okMsg('enr-msg', '已生成，' + (r.expires_in || '?') + ' 秒内有效，一次性使用');
      var box = $('enr-result');
      box.hidden = false;
      box.textContent = r.enrollment_code;
    }).catch(function (e) { err('enr-msg', e.message); });
  });

  function refresh() {
    api('GET', '/admin/devices').then(renderDevices).catch(function () {});
    api('GET', '/admin/audit').then(function (r) {
      var el = $('audit');
      el.innerHTML = '<div class="arow ahead"><span>时间</span><span>事件</span><span>结果</span><span>详情</span><span>耗时</span></div>';
      if (!r.available) { el.textContent = '审计日志写入 stdout（未配置 CODEBRIDGE_AUDIT_LOG 文件），无历史可看。'; return; }
      if (!r.events || !r.events.length) { el.appendChild(mkRow({ time: '', event: '暂无事件', ok: null })); return; }
      // Newest first: no auto-scroll, the header stays visible.
      var parsed = [];
      r.events.forEach(function (line) {
        var ev;
        try { ev = JSON.parse(line); } catch (e) { return; }
        parsed.push(ev);
      });
      parsed.reverse().forEach(function (ev) { el.appendChild(mkRow(ev)); });
    }).catch(function () {});
  }

  setInterval(function () { $('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }); }, 1000);

  if (token) {
    api('GET', '/admin/devices').then(function () {
      $('gate').hidden = true; $('app').hidden = false; refresh();
    }).catch(function () {});
  } else {
    showGate();
  }
  setInterval(function () { if (token && !$('app').hidden) refresh(); }, 5000);
})();
</script>
</body>
</html>
