name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod download
      - run: make fmt-check
      - run: go test ./...
      - name: Build ChatGPT plugin package
        run: go run ./tools/pluginpack --mcp-url https://codebridge.example.com/mcp --app-id plugin_asdk_app_ci123 --out /tmp/codebridge-plugin.zip
      - run: go vet ./...
      - run: make build

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: go mod download
      - name: Cross-build Client, Manager and Doctor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -o "/tmp/codebridge-client${ext}" ./cmd/client
          go build -trimpath -o "/tmp/codebridge-manager${ext}" ./cmd/manager
          go build -trimpath -o "/tmp/codebridge-doctor${ext}" ./cmd/doctor
