name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify
        run: |
          go mod download
          make fmt-check
          go test ./...
          go vet ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist work

          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r GOOS GOARCH <<< "${target}"
            name="codebridge_${VERSION}_${GOOS}_${GOARCH}"
            dir="work/${name}"
            mkdir -p "${dir}"

            ext=""
            if [[ "${GOOS}" == "windows" ]]; then
              ext=".exe"
            fi

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="${LDFLAGS}" \
              -o "${dir}/codebridge-client${ext}" ./cmd/client

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="${LDFLAGS}" \
              -o "${dir}/codebridge-manager${ext}" ./cmd/manager

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="${LDFLAGS}" \
              -o "${dir}/codebridge-doctor${ext}" ./cmd/doctor

            cp README.md LICENSE "${dir}/"

            if [[ "${GOOS}" == "windows" ]]; then
              (
                cd work
                zip -q -r "../dist/${name}.zip" "${name}"
              )
            else
              tar -C work -czf "dist/${name}.tar.gz" "${name}"
            fi
          done

          (
            cd dist
            sha256sum codebridge_* > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "CodeBridge ${GITHUB_REF_NAME}"
